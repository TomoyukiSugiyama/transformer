[package]
name = "transformer"
version = "0.1.0"
edition = "2024"
default-run = "transformer"

[features]
corpus-tools = ["parquet", "arrow-array", "arrow-schema", "reqwest"]
metal = ["candle-core", "candle-nn"]

[dependencies]
matrixmultiply = "0.3.10"
rand = "0.10.1"
rayon = "1.10"
candle-core = { version="0.10.2", features = ["metal"], optional = true }
candle-nn = { version="0.10.2",optional = true }

# Phase 8-1 corpus 準備用 (HuggingFace から Wikipedia 日本語版 parquet を取得・解凍)。
# 学習側 binary には影響しないが、 cargo build 時の依存は増える。
parquet = { version = "53", default-features = false, features = ["arrow", "snap", "zstd"], optional = true }
arrow-array = { version = "53", optional = true }
arrow-schema = { version = "53", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[[bin]]
name = "fetch_wikipedia_ja"
path = "src/bin/fetch_wikipedia_ja.rs"
required-features = ["corpus-tools"]